<!doctype html>
<html lang="en" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta
      name="viewport"
      content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05060c" />
    <title>VIP Club Journal — Andromeda Issue</title>

    <style>
      /* Pre-mount styles only. Everything else lives in main.scss.
         This block must stay tiny: it is parsed before the bundle arrives. */
      html,
      body,
      #app {
        height: 100vh;
        height: 100svh;
      }
      body {
        margin: 0;
        overflow: clip;
        background: #05060c;
      }

      /* Shown from the very first paint, so it also masks the pre-mount FOUC. */
      .fe-preloader {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05060c;
        transition:
          opacity 0.35s ease,
          visibility 0.35s ease;
      }
      .fe-preloader--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .fe-preloader__ring {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 3px solid rgba(255, 118, 204, 0.18);
        border-top-color: #ff76cc;
        animation: fe-spin 0.9s linear infinite;
      }
      @keyframes fe-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fe-preloader__ring {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div class="fe-preloader"><div class="fe-preloader__ring"></div></div>

    <script type="module" src="/src/main.js"></script>

    <script>
      // Safety net: if the app never boots (bad bundle, blocked CDN, dead JS),
      // never leave the user staring at a spinner forever.
      setTimeout(function () {
        var el = document.querySelector('.fe-preloader')
        if (el) el.classList.add('fe-preloader--hidden')
      }, 15000)
    </script>
  </body>
</html>
